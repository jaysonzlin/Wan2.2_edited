data:
  dataset_root: ../simgen/runs/panda_ball_can
  width: 480
  height: 480
  num_frames: 49
  num_points: 2048
  train_start: 0
  train_end: 127
  validation_start: 490
  validation_end: 499
  synthetic_object_slots: 3
  train_batch_size: 1
  dataloader_num_workers: 4
model:
  conditioning: history
  history_frames: 4
  checkpoint_dir: Wan2.2-TI2V-5B
  gradient_checkpointing: true
  utonia_feature_dim: 1088
objective:
  video_type: flow
  pc_type: ddpm_x0
  point_conditioning: noise_video_only
  enable_pc_loss: false
  enable_rigid_loss: false
  enable_deform_loss: false
  num_train_timesteps: 1000
  beta_schedule: linear
  time_shift: 5.0
optimizer:
  video: {lr: 1.0e-5, betas: [0.9, 0.95], eps: 1.0e-8, weight_decay: 0.1}
  bca: {lr: 1.0e-5, betas: [0.9, 0.95], eps: 1.0e-8, weight_decay: 0.1}
  pc: {lr: 1.0e-4, betas: [0.9, 0.999], eps: 1.0e-8, weight_decay: 0.01}
training:
  seed: 42
  gradient_accumulation_steps: 1
  max_train_steps: 4000
  warmup_steps: 200
  lr_scheduler: constant
  max_grad_norm: 2.0
  mixed_precision: bf16
  checkpoint_every_steps: 1000
  checkpoints_total_limit: 2
  resume_from_checkpoint: latest
  pretrained_pc_weights: null
  freeze_pc_and_bridges: true
sampling:
  num_inference_steps: 50
  freeze_auxiliary_pc_state: true
visualization:
  every_steps: 1000
  fps: 12
validation:
  every_steps: 1000
logging:
  output_dir: outputs/joint_simgen_video_only_3slot_frozen_auxiliary_h200_4k
  report_to: wandb
  project: joint-simgen
  run_name: joint-simgen-video-only-3slot-frozen-auxiliary-h200-4k
