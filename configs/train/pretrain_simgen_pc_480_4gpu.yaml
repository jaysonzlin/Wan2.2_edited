data:
  dataset_root: ../simgen/runs/panda_ball_can
  width: 480
  height: 480
  num_frames: 49
  num_points: 2048
  train_start: 0
  train_end: 127
  validation_start: 490
  validation_end: 499
  train_batch_size: 1
  dataloader_num_workers: 4
  utonia_cache_root: outputs/simgen_utonia_feature_cache
model:
  n_layers: 8
  latent_dim: 256
  num_heads: 4
  point_embed: true
  conditioning: history
  history_frames: 4
objective:
  type: ddpm
  prediction_type: x0
  num_train_timesteps: 1000
  beta_schedule: linear
optimizer:
  lr: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01
training:
  seed: 42
  gradient_accumulation_steps: 1
  max_train_steps: 200000
  warmup_steps: 200
  lr_scheduler: constant
  max_grad_norm: 2.0
  mixed_precision: bf16
  checkpoint_every_steps: 250
  checkpoints_total_limit: 2
  resume_from_checkpoint: null
sampling:
  num_inference_steps: 50
validation:
  every_steps: 1000
visualization:
  every_steps: 1000
  fps: 12
logging:
  output_dir: outputs/simgen_pc_pretraining_4gpu
  report_to: wandb
  project: simgen-pc-pretraining
